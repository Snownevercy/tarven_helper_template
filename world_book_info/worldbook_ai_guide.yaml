# SillyTavern 世界书 / 提示词 最佳实践 —— 供 AI 参考
# 格式：根级用 XML 标签包裹，内容为多个 YAML 文档（以 --- 分隔）

<世界书最佳实践>

---
说明:
  本文件供 AI 在编写或审阅 SillyTavern 世界书、角色卡提示词时参考。
  采用「XML 标签 + YAML 内容」：根级用 <世界书最佳实践> 包裹，其内为若干 YAML 文档（--- 分隔），便于划分区块与精确引用。

---
xml_标签使用:
  作用: 用自定义标签包裹提示词，区分作用并支持在别处精确引用
  写法: "<名字> 内容 </名字>"
  常见用法:
    - 思维链: "<thinking_format> 输出要求 </thinking_format>"，"<thinking> 具体内容 </thinking>"
    - 正文: "<content> 正文 </content>"
    - 在别处引用: "必须先输出<thinking>再输出<content>"
  注意: 标签名自定即可，提示词写法不受限；可参考 Claude 官方 XML 标签用法

---
yaml_结构化与文档:
  文档分隔: "---" 表示一个 YAML 文档开始，到下一个 "---" 或文件末尾为该文档
  命名: 每个文档视为一个逻辑块（如 角色详情、角色关键信息、世界运转）
  精确引用:
    - "某 document" = 某个 --- ... --- 整块
    - "某 mapping inside 某 document" = 某文档下某键及其子内容
  与非 YAML 混排时:
    - 用 "..." 表示当前 YAML 文档结束
    - 或用 ```yaml 代码块包裹 YAML，前后为普通文本

---
yaml_书写格式:
  缩进:
    - 禁止 Tab，只用空格；同级必须一致
    - 推荐每级 2 个空格
  序列:
    - 推荐「零缩进」: "-" 与父键对齐
    - 多级序列可考虑 flow style [a, b] 提高可读性
  键与值:
    - 同一行不可写 "key: inner: map" 或 "key: - seq"
    - 序列项可与 mapping 同行: "sequence:\n  - a: b\n    c: d"
  文件扩展名: 推荐 .yaml
  何时给纯量加引号:
    - 需强制为字符串、以非字母数字开头、含控制字符或 Tab
    - 含 ": "、" #"、" - "、":" 结尾，或 flow 中含 {}[],"

---
yaml_锚点与复用:
  目的: 少重复、省 token、易维护
  定义锚点: "&名字" 放在要复用的节点前
  引用: "*名字" 在别处展开
  合并进当前 mapping: "<<: *名字"
  典型用法:
    - 多个变量共用同一 type/check: 定义 &变量模板，其他用 <<: *变量模板 并只写差异（如 range）
    - 列表中重复子列表: 如 &day_dusk [白天, 黄昏]，多处 *day_dusk
    - 多条相同 check: &check_rule 一条，其余 *check_rule
  说明: 锚点在提示词中起示意作用，模型能理解即可

---
xml_与_yaml_混合:
  用 XML 包裹多段 YAML:
    - "<世界信息>\n---\n文档1: ...\n---\n文档2: ...\n</世界信息>"
  在 YAML 内使用 XML:
    - 在 format、rule、description 等字段中写 "<status>...</status>" 等
  效果: 既有 YAML 的结构与命名，又有 XML 的区块语义

---
世界书条目写作要点:
  结构: 用 --- 分文档、用顶层 key 命名（角色阶段、变量更新规则、背景列表等）
  可引用: 在别处写「回忆某 document 中某 mapping」即可精确定位
  少重复: 相同结构用锚点；相似项用 <<: *锚点 只写差异
  格式: 缩进 2 空格、序列零缩进、必要时加引号、禁止 Tab

</世界书最佳实践>
