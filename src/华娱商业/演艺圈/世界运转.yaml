---
rule_世界运转:
  驱动引擎:
    逻辑总纲: "世界演化由时间轴推进 + 蝴蝶效应 + 资源争夺三大引擎驱动。"
    时间基准: "所有判定与推演必须严格锚定world.currentDate。变量具体更新时机与格式见 [mvu_update]变量更新规则。"
  模块一_时间轴推进:
    - "每次交互根据剧情推进时间；每日/每月相关的新闻与professionalAssessment.currentTier结算，按变量更新规则执行。"
  模块二_蝴蝶效应:
    定义: "系统对User行为的动态响应，涉及butterflyEffect.erasedList与世界新闻的写入均按变量更新规则执行。"
    分支A_作品发布判定:
      说明: "剧情侧逻辑"
      触发: "User发布作品。"
      IF_文抄: "作品属于现实历史中的未来作品 -> 触发抹除机制，剥离原作者与该作品的因果联系；erasedList 的查重与写入按变量更新规则。"
      ELSE_原创或魔改: "作品为原创/大幅魔改 -> 按作品质量生成市场反馈；不触发抹除，原作者仍可在未来创作该作品。"
    分支B_风暴眼逻辑:
      说明: "历史干涉"
      触发: "User试图改变命运锚点（如救下必死之人、阻止重大丑闻）。"
      顺势而为: "仅利用信息差获利，关键节点仍按历史发生 -> 历史维持原轨。"
      逆天改命: "成功改变关键节点 -> 触发世界线变动，通过新闻/传闻反馈IF线变动后果（可能灾难性）。"
  模块三_行为逻辑锁:
    说明: "现实引力"
    核心: "NPC行为决策受限于其显性身份的资源调动阈值；规则参数依world.currentLocation的治安与world.currentDate的法治程度映射。"
    维度一_资源匹配律:
      商人艺人: "仅限资金、舆论、商业施压；严禁直接指挥国家暴力机关。"
      官僚权贵: "权力限于职权内规则倾斜；严禁为低价值目标违规干预。"
      阶级壁垒: "低阶NPC调用高阶保护伞时，若无深度利益绑定，强制调用失败。"
    维度二_环境制约律:
      强秩序区: "物理暴力屏蔽；冲突转化为合法博弈（报警/诉讼/曝光）；强行突破必触发执法介入。"
      弱秩序区: "允许暴力/胁迫/阴谋；NPC极端行为前须进行善后成本检定，成本高于收益则放弃。"
    维度三_时代映射律:
      法治严明: "人脉仅能获取信息或拖延流程，不能干预案件定性；舆论战为高效武器。"
      野蛮生长: "人脉可干预司法；物理消灭为常规竞争手段。"
  模块四_商战演化:
    说明: "资源分配"
    资源守恒: "User获得S级资源（如顶奢代言）时，须判定哪位竞品NPC失去它。"
    零和博弈: "剧情须体现「失败者」反应，可致其network.relationshipBook人脉值下降。"
    例外判定: "项目为市场首创/蓝海开拓时豁免资源守恒，竞品反应为跟风/嫉妒。"
    变量更新: "舆论与professionalAssessment相关变量的更新按变量更新规则执行。"
