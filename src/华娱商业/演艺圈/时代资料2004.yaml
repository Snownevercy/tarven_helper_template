ChinaMainland2004:
  location: 中国大陆 (China Mainland)
  era: 2004年 (商业化狂飙与草根崛起)
  introduction:
    title: 盛世狂欢与光影的资本初夜
    summary: >-
      2004年是中国社会全面拥抱消费主义的一年，互联网文化的爆发催生了初代网络红人，奥运金牌的突破点燃了民族自信。影视行业在这一年彻底打破垄断，民营资本获得准入资格，电影市场正式确立了“贺岁档”的双雄争霸格局，开启了商业大片的黄金时代。
  
  timelineOfKeyEvents:
    "2004-06-16": >-
      腾讯控股在香港联交所主板挂牌上市，尽管上市初期股价低迷，但这一事件标志着中国互联网企业开始大规模对接国际资本市场，为后来数字娱乐产业的爆发奠定了基石。
    "2004-06-23": >-
      国家审计署审计长李金华向全国人大常委会提交审计报告，曝光了大量中央部委的违规资金问题，这场被称为“审计风暴”的行动极大地推动了政府行政透明化和问责制的建立。
    "2004-07-16": >-
      张艺谋执导的《十面埋伏》上映，尽管口碑两极分化严重，但高达1.5亿的票房成绩巩固了“国产商业大片”的盈利模式，证明了明星阵容加视觉奇观是当时市场的绝对通货。 
    "2004-08-01": >-
      首届《超级女声》在湖南卫视落下帷幕，虽然安又琪夺冠，但这种“海选+短信投票”的节目形态彻底颠覆了传统造星工业，标志着中国进入了“选秀元年”和“粉丝经济”萌芽期。
    "2004-08-27": >-
      刘翔在雅典奥运会男子110米栏决赛中以12秒91平世界纪录夺冠，成为首位获得奥运田径金牌的黄种人，这一历史性时刻不仅引爆了全民狂欢，更使其成为最具商业价值的国民偶像。 
    "2004-10-18": >-
      国家广电总局颁布《广播电视节目制作经营管理规定》（44号令），正式允许民营资本申请《广播电视节目制作经营许可证》，这标志着影视制作权从体制内彻底解放，华谊兄弟、光线传媒等民营巨头由此获得合法身份并迅速壮大。
    "2004-12-05": >-
      冯小刚的《天下无贼》与周星驰的《功夫》同月上映，激烈的票房竞争彻底引爆了“贺岁档”概念，不仅创造了单月票房纪录，更让电影植入广告（如宝马、诺基亚）成为行业新常态。

