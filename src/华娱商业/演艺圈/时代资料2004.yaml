        股市进入“失落的十年”初期的阴跌阶段，全年指数在1783点至1259点之间单边下行，“国九条”的发布虽有短期提振，但未能扭转因宏观调控和股权分置问题导致的熊市格局。
      benchmark_interest_rate_avg: "5.58% (九年来首次加息)"

