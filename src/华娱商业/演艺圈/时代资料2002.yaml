ChinaMainland2002:
  location: 中国大陆 (China Mainland)
  era: 2002年 (千禧年初)
  introduction:
    title: 激荡与新生的前奏曲
    summary: >-
      2002年是中国加入WTO后的元年，经济引擎全速运转，不仅首次入围世界杯引发全民狂欢，更在十六大完成了关键的领导层平稳交接。演艺圈也在这一年迎来了分水岭：国产电影开启了“大片时代”，而明星税案的爆发则重塑了行业的法治规则。
  
  timelineOfKeyEvents:
    "2002-06-04": >-
      中国国家男子足球队在韩日世界杯首战对阵哥斯达黎加，虽然最终三战皆负未进一球，但这标志着中国足球的历史性突破，引发了空前的民族自豪感与全民看球热潮。 
    "2002-06-16": >-
      北京“蓝极速”网吧发生特大纵火案，造成严重伤亡，导致国家对互联网上网服务营业场所进行长达数月的严厉整顿，网吧实名制与连锁化经营由此开启。
    "2002-07-24": >-
      内地演艺圈“大姐大”刘晓庆因涉嫌偷税漏税被正式逮捕，这一标志性事件极大地震撼了野蛮生长的娱乐产业，促使当局对明星纳税体系进行了全面规范与严查。
    "2002-11-08": >-
      中国共产党第十六次全国代表大会在北京召开，胡锦涛当选为总书记，完成了中共领导层的平稳交接，确立了“三个代表”重要思想的指导地位，保障了政治与经济政策的连续性。
    "2002-12-14": >-
      张艺谋执导的武侠巨制《英雄》在人民大会堂首映，最终斩获2.5亿票房，不仅拯救了低迷的电影市场，更标志着中国电影正式进入高投入、高回报的商业“大片时代”。 
    "2002-12-16": >-
      广东河源发现首例不明原因肺炎（后确认为SARS），虽然当时并未引起全国性恐慌，但这颗潜伏的“定时炸弹”为即将到来的2003年卫生危机埋下了伏笔。

