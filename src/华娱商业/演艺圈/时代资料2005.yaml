ChinaMainland2005:
  location: 中国大陆 (China Mainland)
  era: 2005年 (全民选秀与草根觉醒)
  introduction:
    title: 短信投票下的狂欢与解构
    summary: >-
      2005年是大众娱乐文化彻底爆发的一年，“超级女声”的民主投票机制引发了前所未有的全民狂欢，标志着偶像产业进入“粉丝造星”时代。与此同时，互联网“恶搞”文化伴随着《无极》的争议强势崛起，影视行业在资本的大举入侵下，迎来了商业大片与草根解构主义的激烈碰撞。
  
  timelineOfKeyEvents:
    "2005-03-14": >-
      十届全国人大三次会议高票通过《反分裂国家法》，以法律形式明确了遏制“台独”分裂势力、维护国家主权的底线，为两岸关系划定了清晰的红线。
    "2005-04-29": >-
      中国国民党主席连战率团访问大陆，并与中共中央总书记胡锦涛举行历史性会谈，不仅打破了国共两党长达60年的隔绝，也极大地缓和了台海紧张局势。
    "2005-06-06": >-
      上证指数盘中跌破1000点大关，触及998.23点的历史大底。这一至暗时刻倒逼管理层启动了具有划时代意义的“股权分置改革”，为随后的大牛市奠定了制度基础。
    "2005-07-21": >-
      中国人民银行宣布实行以市场供求为基础、参考一篮子货币进行调节的浮动汇率制度，人民币不再单一盯住美元，初始汇率升值2%，这一改革开启了人民币长达数年的升值通道。
    "2005-08-05": >-
      百度在纳斯达克上市，首日股价暴涨354%，创造了中国概念股的神话，标志着中国互联网搜索引擎市场的格局已定，也不仅刺激了无数创业者的造富梦想。 
    "2005-08-26": >-
      湖南卫视《超级女声》总决赛落幕，李宇春以352万条短信投票夺冠。这场史无前例的“民选偶像”运动不仅重塑了内地音乐产业，更成为了一个深刻的社会学现象。 
    "2005-09-12": >-
      抗战剧《亮剑》在央视首播，李云龙这一“有缺点的英雄”形象迅速征服全国观众，该剧不仅创下当年的收视纪录，更成为国产军旅剧难以逾越的高峰。 
    "2005-12-15": >-
      陈凯歌执导的奇幻史诗片《无极》上映，虽然票房不俗，但引发了巨大的口碑争议。网友胡戈制作的恶搞视频《一个馒头引发的血案》在网络疯传，这起事件标志着互联网草根话语权对精英文化的首次成功解构与颠覆。

