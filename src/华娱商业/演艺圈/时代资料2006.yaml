        超级大牛市的爆发之年。指数从年初的1161点起步，一路高歌猛进突破2600点，全年涨幅超过130%，全民入市，“死了都不卖”成为年度流行金曲。
      benchmark_interest_rate_avg: "6.12% (两次加息以抑制过热)"

