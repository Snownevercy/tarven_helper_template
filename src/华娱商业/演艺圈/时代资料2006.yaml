ChinaMainland2006:
  location: 中国大陆 (China Mainland)
  era: 2006年 (牛市狂飙与大片泡沫)
  introduction:
    title: 喧嚣的资本与光影的突围
    summary: >-
      2006年，中国股市开启了史诗般的“大牛市”征程，农业税的废止终结了长达两千年的皇粮国税。影视行业在这一年呈现出极端的两极分化：张艺谋的《满城尽带黄金甲》将“大片”的奢华与空洞推向极致，而宁浩的《疯狂的石头》则以黑色幽默完成了小成本电影的惊艳突围。
  
  timelineOfKeyEvents:
    "2006-01-01": >-
      《中华人民共和国农业税条例》正式废止，中国延续了2600年的“皇粮国税”成为历史，这一里程碑式的政策极大地减轻了农民负担，标志着国家发展战略向工业反哺农业的重大转型。
    "2006-01-02": >-
      情景喜剧《武林外传》在央视电视剧频道首播，迅速成为一种文化现象，它用后现代的解构手法和网络流行语重塑了武侠世界，成为一代年轻人的集体记忆与网络造梗的源头。 
    "2006-06-30": >-
      宁浩执导的小成本电影《疯狂的石头》上映，以300万投资博得2300万票房，其多线叙事结构与本土黑色幽默彻底颠覆了国产喜剧模式，证明了“好故事”比“大明星”更具票房号召力。 
    "2006-07-01": >-
      青藏铁路全线通车，结束了西藏不通火车的历史，这条“天路”不仅是工程史上的奇迹，更加速了西部地区的经济开发与人员流动。 
    "2006-10-27": >-
      中国工商银行在上海和香港同步上市，创下当时全球最大IPO纪录，这不仅标志着中国国有商业银行股份制改革的收官，更助推上证指数加速冲刺，点燃了全民炒股的狂热激情。
    "2006-11-20": >-
      南京“彭宇案”发生（后于2007年宣判），这起因搀扶跌倒老人引发的民事诉讼案，虽然真相扑朔迷离，但其引发的社会大讨论对公众道德观念产生了深远的“寒蝉效应”，改变了人们的互助心理。
    "2006-12-14": >-
      张艺谋执导的《满城尽带黄金甲》上映，虽以2.9亿票房刷新国产电影纪录，但其满屏的“挤胸”造型和形式大于内容的剧情引发了铺天盖地的批评，引发了关于“大片已死”的深刻反思。 

