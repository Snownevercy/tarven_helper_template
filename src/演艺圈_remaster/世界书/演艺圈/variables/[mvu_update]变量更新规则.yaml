---
变量更新规则:
  # --- 世界环境 ---
  世界:
    当前日期:
      format: YYYY-MM-DD 周X HH:mm
      check:
        - '严禁时间倒流或无故跳跃。'
    当前地点:
      check:
        - '格式建议：国家-城市-具体位置（如：中国-北京-三里屯）。'
    ${时代新闻|行业新闻|八卦新闻}:
      check:
        - '[时间戳生成准则] 1.定点事件=YYYY-MM-DD；2.月度事件=YYYY-MM；3.年度趋势=YYYY。'
        - "[时代新闻] 发生新的大事件时更新。若变量为'无'或原新闻已过时（>30天），必须检索当前时间点的大事件进行更新。"
        - "[行业新闻] 发生高热度娱乐圈事件时更新。若变量为'无'或原新闻已过时（>15天），必须检索当前时间点的娱乐圈事件进行更新。"
        - "[八卦新闻] 发生高热度娱乐八卦新闻时更新。若变量为'无'或原新闻已过时（>7天），必须检索当前时间点的娱乐八卦新闻进行更新。"
        - '更新内容必须基于[当前日期]所对应的真实历史年份，严禁捏造或死守预设年份。'

  # --- 主角档案 ---
  主角:
    外貌:
      check:
        - '在开场白或初次描写时录入主角的外貌特征。'
        - '后续仅在发生永久性显著改变（如毁容、整容、明显衰老）时更新，不要因为更换衣物而修改。'
    ${姓名|职业|性癖}:
      check:
        - '基础资料通常保持稳定，仅在剧情明确发生变化时更新。'
        - '[性癖] 为隐藏变量，通常在开场白或初次描写时录入，用于后续剧情生成导向。'

  # --- 作品与成就 ---
  职业履历.${作品名|获取奖项}:
    type: string[]
    check:
      - 仅在主角发布新作品或获得正式奖项时向数组追加新条目
      - '仅收录主角作为核心主创（导演/主演/编剧/制片）的作品。'
      - 格式应为“《作品名》”或“奖项名称(年份)”

  # --- 行业评估 ---
  专业评估:
    当前咖位:
      check:
        - '综合[粉丝基础]、[职业履历]与[个人账户]进行评定。'
        - '等级参考：素人 -> 十八线 -> 三线 -> 二线 -> 一线 -> 顶流 -> 巨星。'
    ${业务能力|媒体风向|社会风评|粉丝基础}:
      check:
        - '当主角发布新作品、展示才艺或发生行业互动时，必须重新评估[业务能力]与[粉丝基础]。'
        - '随着主角发布作品、卷入舆论事件或进行公开活动后动态调整[媒体风向]与[社会风评]。'
        - '[媒体风向] 侧重官方/主流媒体的态度（如：力捧/打压/观望）。'
        - '[社会风评] 侧重大众/网友的口碑（如：国民老公/全网黑/实力派）。'

  # --- 个人账户 ---
  个人账户:
    ${月度固定收入|月度固定支出}:
      type: number
      check:
        - 当主角的生活水平、薪资结构或长期负债发生结构性变化时调整
        - '⚠️ 个人一次性收支（如买车、买房、片酬入账、代言费等）不计入此字段，走[私账一次性变动]。'
    私账一次性变动:
      type: number
      check:
        - 记录本轮剧情中发生的个人账户的一次性大额收支
        - '适用场景：片酬到账、代言费、分红收入、购买资产、大额消费等。'
        - '若本轮既有收入又有支出，填写净值即可。'
        - '严禁混淆公私账户：公司盈利属于公司，只有通过分红/发工资才能流入个人账户。'
    合约状态:
      check:
        - '记录当前经纪合约状态，用于判断咖位。'
        - '格式：「公司名+年限+类型」如「华谊兄弟3年独家」'
        - "无合约填「无」，解约后填「无（原华谊）」"
    持有资产.${房产|车辆|股票}:
      type: string[]
      check:
        - '格式：「资产描述@数量@购入总价」'
        - '⚠️ 金额统一使用人民币，外币资产需换算。'
        - '出售资产时删除对应条目，所得计入[私账一次性变动]。'
  # --- 公司账户 ---
  公司账户:
    运行项目:
      type: |-
        {
          [业务线名称: string]: {
            项目范围: string;//用简短文本描述该项目当前涵盖的业务范围、边界与适用场景
            月销量: number; // 随剧情经营状况波动
            单价: number; // 定价策略调整时更新
            可变成本率: number; // 0.0~1.0，随供应链或渠道成本变化
          }
        }
      check:
        - 在调整现有业务定价或销量发生显著波动时更新
        - 若剧情中涉及新产品，请确认新产品是否在现有项目的[项目范围]内,如果已经存在,则更新现有项目的月销量和单价。如果不在现有范围内，则添加新业务线。
        - 若业务线被砍掉，则从记录中移除
    固定成本.${人力成本|场地成本|}:
      type: number
      check:
        - 当招聘/裁员、搬迁办公室或签订新租约时更新对应数值
    固定成本.营销预算:
      type: number
      check:
        - '月度固定的营销投入预算，如常规广告投放、SEO、社媒运营等。'
        - '⚠️ 大型一次性营销活动（如发布会、签代言人）应走[公账一次性变动]。'
    固定成本.其他运营:
      type: number
      check:
        - '其他月度固定支出，如软件订阅、设备租赁/折旧、保险等。'
    公账一次性变动:
      type: number
      check:
        - '⚠️ **仅记录本轮发生的公账一次性变动资金流动**（如融资到账、购买设备、赔偿金、大型一次性营销活动等）'
        - 收入为正，支出为负；若无变动则重置为 0
  # --- 社交网络 ---
  人脉:
    社交版图:
      type: string[]
      check:
        - '概括主角当前的社交圈层（如：京圈、沪圈、电影学院派、煤老板圈）。'
        - '当主角成功打入新圈子或被踢出圈子时更新。'
    关系簿:
      type: |-
        {
          [NPC姓名: string]: number // range: -100~100
        }
      check:
        - '仅在发生有意义的交互（争吵、合作、调情、背叛等）时更新'
        - '[入库防火墙 - 必须严格执行的过滤程序]:'
        - '1. 实名制认证: 仅收录具备[真实全名]的NPC。严禁收录通用代称。'
        - '2. 价值门槛: 仅当该NPC具备[社会影响力]或与主角发生[有效利益交换]时才可入库。'
        - '3. 必须执行: 若交互对象为功能性路人，无论人脉值如何变化，严禁写入此变量。'
        - '[数值逻辑]:'
        - '  (++) 深度绑定: 救命/犯罪/重大利益 (+15~30)。'
        - '  (+) 普通好感: 合作/受惠/吹捧 (+2~10)。'
        - '  (-) 利益摩擦: 抢夺/冒犯/嫉妒 (-2~10)。'
        - '  (--) 死敌仇恨: 挡路/夺妻/背叛 (-15~30)。'
    近期互动:
      type: string[]
      check:
        - '[去重指令] 若NPC已在列表中，必须先删除旧条目，只保留最新状态。'
        - '选取最近1-3个因主角行为导致[人脉值]发生变化的NPC。'
        - "格式示例：['杨幂(↑信服)', '卓伟(↓死磕)']。"

  # --- 特殊机制 ---
  蝴蝶效应:
    已抹除列表:
      type: |-
        {
          [被抢占的作品名: string]: string // 键为作品名，值为原作者/原拥有者
        }
      check:
        - '当主角发布作品时，若该作品在现实历史中属于未来或其他创作者，必须在此记录。'
        - 'Key为作品名，Value为现实中的原作者。'
        - '作用：用于触发<rule_世界运转>模块二的[抹除机制]，防止原作者在未来重复创作该作品。'
