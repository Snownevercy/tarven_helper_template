    启用: true
    激活策略:
      类型: 蓝灯
    插入位置:
      类型: 角色定义之后
      顺序: 100
    激活概率: 100
    递归:
      不可被其他条目激活: true
      不可激活其他条目: true
    文件: 演艺圈\variables\变量列表

  - 名称: "[mvu_update]变量更新规则"
    启用: true
    激活策略:
      类型: 蓝灯
    插入位置:
      类型: 指定深度
      角色: 系统
      深度: 0
      顺序: 198
    激活概率: 100
    递归:
      不可被其他条目激活: true
      不可激活其他条目: true
    文件: 演艺圈\variables\[mvu_update]变量更新规则

  - 名称: "[mvu_update]变量输出格式"
    启用: true
    激活策略:
      类型: 蓝灯
    插入位置:
      类型: 指定深度
      角色: 系统
      深度: 0
      顺序: 199
    激活概率: 100
    递归:
      不可被其他条目激活: true
      不可激活其他条目: true
