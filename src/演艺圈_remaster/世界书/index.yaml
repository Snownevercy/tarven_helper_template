  - 名称: "[mvu_update]变量输出格式强调"
    启用: true
    激活策略:
      类型: 蓝灯
    插入位置:
      类型: 指定深度
      角色: 系统
      深度: 0
      顺序: 200
    激活概率: 100
    递归:
      不可被其他条目激活: true
      不可激活其他条目: true
