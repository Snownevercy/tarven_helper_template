---
ChinaMainland2000:
  location: 中国大陆 (Mainland China)
  era: 2000年 (千禧年/世纪之交)
  introduction:
    title: 拨号声中的流量前夜与短信狂欢
    summary: >-
      2000年是跨越世纪的节点，中国即将加入WTO的预期点燃了经济引擎，城市化进程加速。此时正值互联网泡沫破裂与重生的临界点，移动梦网（Monternet）的横空出世开启了SP业务的暴利时代，将濒临倒闭的互联网巨头从悬崖边拉回，同时也孕育了网络文学的草根萌芽。

  timelineOfKeyEvents:
    "2000-02-25": >-
      江泽民在广东考察时首次提出“三个代表”重要思想，这一理论随后成为党的重要指导思想，标志着执政党在世纪之交对自身角色的深刻调整与重新定位。
    "2000-04-13": >-
      新浪网在纳斯达克上市，随后网易、搜狐相继挂牌，标志着中国互联网“三大门户”时代的正式确立，尽管随即遭遇全球互联网泡沫破裂引发的股价暴跌，但这也开启了中概股赴美上市的先河。
    "2000-05": >-
      蔡智恒的《第一次亲密接触》实体书在大陆畅销，同时“榕树下”网站举办首届网络文学大赛，不仅标志着网络文学从BBS小众狂欢走向大众视野，更开启了流量变现的早期探索。
    "2000-07-19": >-
      上证指数首次突破2000点大关，股市的繁荣吸引了大量散户入场，但也伴随着“基金黑幕”等监管问题的暴露，促使金融市场制度建设被迫加速。
    "2000-09": >-
      悉尼奥运会上中国代表团斩获28枚金牌，进入金牌榜前三，极大地振奋了民族自信心，也为随后北京申奥成功（2001年）奠定了心理与舆论基础。
    "2000-11-10": >-
      中国移动正式推出“移动梦网”（Monternet）计划，确立了与SP（服务提供商）的分成模式。这一破局之举让面临盈利危机的互联网公司通过短信订阅、彩铃下载实现惊天逆转，直接催生了随后数年的“SP暴利黄金期”。

