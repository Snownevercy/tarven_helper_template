ChinaMainland2001:
  location: 中国大陆 (Mainland China)
  era: 2001年
  introduction:
    title: 盛世入场券与移动奇迹的元年
    summary: >-
      2001年是中国现代史的“超级大年”，入世与申奥成功让举国沉浸在拥抱世界的宏大叙事中。互联网行业在纳斯达克泡沫破裂后通过移动SP（增值业务）意外开启了中国式盈利模型，实现了从“活下去”到“野蛮生长”的惊人跳跃。

  timelineOfKeyEvents:
    "2001-04-01": >-
      中美撞机事件在南海发生，导致中方飞行员王伟牺牲，此事件引发了全国范围的爱国主义浪潮并令中美关系陷入阶段性冰点。
    "2001-07-13": >-
      萨马兰奇在北京时间深夜宣布北京获得2008年奥运会主办权，引发举国彻夜狂欢，极大地提振了民族自信心与基建预期。
    "2001-09-11": >-
      美国遭遇恐袭，全球地缘政治格局剧变，此事件间接改善了中国的外部战略环境，为后续十年的黄金发展期争取了空间。
    "2001-09-28": >-
      陈天桥的盛大网络在中国大陆地区正式运营《传奇》，开启了中国网络游戏的大航海时代，也标志着SP业务与点卡计费模型的成熟。
    "2001-10": >-
      上海成功举办APEC会议，中国向世界展示了改革开放的窗口形象，进一步确立了中国在亚太地区的经济地位。
    "2001-11-10": >-
      多哈会议正式通过中国加入世贸组织（WTO）的决定，标志着中国全面融入全球分工体系，开启了长达十年的两位数增长神话。
    "2001-11": >-
      中国移动正式推出“移动梦网”计划，打破了互联网与电信的壁垒，救活了包括腾讯、搜狐在内的第一代濒临破产的互联网巨头。


