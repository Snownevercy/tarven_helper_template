---
rule_生涯变数:
  核心机制:
    驱动逻辑:
      - "判定源: 严格基于 professionalAssessment.currentTier + career.works (检索发布时间<3个月内的条目) + world.currentDate 三维数据。"
      - "强制性: 系统必须在 world.currentDate 的日(DD)变更时，自动检索是否有符合条件的变数，若有，在正文中合理插入相关事件。"
  模块一_商业变现:
    触发节点: "[作品发布] 后 或 professionalAssessment 处于热议期。"
    资源分级:
      流量收割_快消品:
        判定: "professionalAssessment.fanbase 达到「死忠/狂热」 且三个月内新增热门 career.works。"
        事件: 品牌方(酸奶/手游/电动车)主动递送短期高价合约。
      品牌借势_时尚圈:
        判定: "protagonist.appearance 极其突出 或 professionalAssessment.currentTier ≥ 二线。"
        事件: 奢牌PR主动联系推封/借衣/看秀。
      竞品掠夺_顶层通吃:
        判定: "professionalAssessment.currentTier 晋升一线 且 竞品NPC遭遇丑闻。"
        兼容性锁: "仅当 [User人设标签] 与品牌调性兼容时触发。"
        事件: 竞品原本持有的全线代言，被品牌方强行转单给User。
  模块二_名利场:
    年度盛典_芭莎GQ:
      - "触发: 每年9月-12月 (系统自动检索历史时间)。"
      - "强制: 若 professionalAssessment.currentTier ≥ 二线，User将受到邀请。"
      - "剧情: 红毯排位争夺/C位让渡/后台名利场交际。"
    家国时刻_突发:
      - "触发: world.eraNews 出现重大灾害(地震/疫情)时。"
      - "强制: 必须生成「捐款决策」剧情点。"
  模块三_荣誉加冕:
    周期判定:
      - "触发: 作品正式完成后。"
      - "机制: 系统检索现实中各大相关奖项(金鸡/金像/戛纳等)的 [征集期] 与 [颁奖期]。"
      - "逻辑: 只要当前时间处于该奖项的运作周期内，即可触发相关剧情(如: 报送选送/入围通知/公关拉票/红毯邀约)。"
    初审阶段:
      - "触发: 作品正式报名相关奖项后。"
      - "机制: 系统基于作品生成相关剧情进行质量初筛。"
      - "结果: 质量达标 -> 必定入围，生成「提名名单公布」的新闻；质量平庸 -> 直接落选，生成「遗珠」或「被嘲」的舆论。"
    国际影展_S级特判:
      - "仅当电影质量评价达到「神作/影史留名」级别时。"
      - "强制触发欧洲三大国际电影节(柏林/戛纳/威尼斯)「主竞赛单元入围」剧情。"
    决选阶段:
      - "窗口期: 从「提名公布」到「颁奖典礼」之间的剧情时间。"
      - "最终判定: 根据User选择评估最终结果。"
  模块四_阶级代价:
    上升期_二三线:
      - "必经之路: 热门综艺(常驻刷脸) / 烂片(还人情) / 甚至无偿站台。"
      - "逻辑: 想要 professionalAssessment.fanbase，就必须牺牲部分羽毛。"
    爆发期_一线:
      - "资本捆绑: 必须面临 [对赌协议] 或 [站队] 选择。"
      - "逻辑: 资源不再是免费的，每一份S级合约背后都标注了潜在风险。"
  模块五_舆论反噬:
    数据溢出:
      - "触发: professionalAssessment.fanbase 暴涨后。"
      - "现象: 唯粉撕逼、私生饭跟踪、旧言论被考古挖坟。"
      - "目的: 增加游戏难度，防止User无脑爽文式升级。"
