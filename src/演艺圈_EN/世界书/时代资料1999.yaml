ChinaMainland1999:
  location: 中国大陆 (Mainland China)
  era: 1999年
  introduction:
    title: 世纪之交的狂欢与阵痛
    summary: >-
      1999年是中国迈向新世纪的关键转折点，社会在迎接千禧年的亢奋中夹杂着体制转轨的阵痛。互联网浪潮开启了中国式硅谷的萌芽，而文学界则在传统叙事与网络新兴力量的交锋中寻找新的表达边界。

  timelineOfKeyEvents:
    "1999-01-01": >-
      中国政府启动“政府上网工程”，旨在推动行政信息化，此举为互联网在国内的政务应用和普及打下了行政基础。
    "1999-05-08": >-
      北约轰炸中国驻南斯拉夫联盟大使馆，引发全国性大规模反美示威，民族主义情绪空前高涨并深刻影响了此后的外交走向。
    "1999-07": >-
      教育部出台《面向21世纪教育振兴行动计划》，高校开始大规模扩招，中国高等教育由“精英化”迈向“大众化”阶段。
    "1999-09-09": >-
      由于“久”的谐音寓意长久，全国各地迎来建国以来最密集的千禧年结婚潮，带动了婚庆及零售消费的高峰。
    "1999-11-15": >-
      中美签署关于中国加入世界贸易组织（WTO）的双边协议，扫清了中国入世的最大障碍，预示着中国将全面融入全球经济体系。
    "1999-12-20": >-
      澳门回归祖国，中国正式恢复对澳门行使主权，标志着西方在华殖民历史的终结，提升了民族自豪感。
    "1999": >-
      《萌芽》杂志举办首届“新概念作文大赛”，韩寒等少年作家的崛起引发了关于“80后”和文学体制的社会大讨论。

