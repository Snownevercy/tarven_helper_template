    financial_snapshot:
      stock_index_name: 上证指数 (SSE Composite Index)
      era_defining_feature: >-
        年初市场低迷，5月19日受政策利好刺激爆发“5·19行情”，科技网络股领涨，上证指数在短短一个多月内涨幅超过50%，随后进入高位震荡。
      benchmark_interest_rate_avg: 经历多次降息以刺激内需，一年期存款利率约为2.25%。

