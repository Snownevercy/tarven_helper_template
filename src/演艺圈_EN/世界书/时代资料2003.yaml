ChinaMainland2003:
  location: 中国大陆 (China Mainland)
  era: 2003年 (非典危机与神舟飞天)
  introduction:
    title: 口罩下的静默与太空中的腾飞
    summary: >-
      2003年是极具戏剧性的一年，SARS疫情的爆发让社会陷入短暂的恐慌与停摆，但随后的神舟五号载人航天成功又极大地提振了民族自信。影视行业在此年迎来巨变，CEPA协议的签署彻底打开了香港与内地合拍片的大门，促使产业格局迅速向商业化和融合化转型。
  
  timelineOfKeyEvents:
    "2003-04-20": >-
      卫生部正式公布非典型肺炎（SARS）疫情实情，国务院随后取消五一长假并实行严格的隔离措施，这一公共卫生危机导致全国城市陷入空前的静默，极大地改变了公众的卫生习惯与政府的信息公开机制。 
    "2003-06-20": >-
      针对大学生孙志刚在收容遣送站死亡一案，国务院颁布新规废止了《城市流浪乞讨人员收容遣送办法》，这一标志性事件被视为中国法治进程与人权保障的重要里程碑，体现了舆论监督的力量。
    "2003-06-29": >-
      《内地与香港关于建立更紧密经贸关系的安排》（CEPA）正式签署，其中针对影视行业的条款允许香港电影不再受进口配额限制，这一政策直接引爆了“合拍片”热潮，重塑了华语电影的制作生态。
    "2003-10-15": >-
      神舟五号载人飞船成功发射，航天员杨利伟成为中国进入太空第一人，这标志着中国成为全球第三个掌握载人航天技术的国家，极大地激发了爱国主义热情和科技自豪感。 
    "2003-11": >-
      张艺谋执导的《英雄》在北美公映并夺得票房周冠军，虽然国内关于商业与艺术的争论未休，但其成功的海外输出模式刺激了更多资本涌入影视行业，确立了“大片”作为行业龙头的地位。
    "2003-12-18": >-
      冯小刚执导的贺岁片《手机》上映，最终成为年度票房冠军，影片不仅引发了关于婚姻信任与隐私危机的广泛社会讨论，也侧面反映了移动通讯工具在日常生活中的爆发式普及。 

